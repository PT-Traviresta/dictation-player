<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictation Player</title>
<style>

/* ── Reset & Base ──────────────────────────────────────── */

*{box-sizing:border-box;margin:0;padding:0}

@font-face {
    font-family: irohamaru mikami; 
    src: url('assets/_irohamaru mikami.ttf');
}

body{
    font-family:"irohamaru mikami","Yu Gothic","Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    /*background:linear-gradient(160deg,#0d0d1a 0%,#1a1a2e 50%,#16213e 100%);*/
    background:linear-gradient(160deg, #c3c3d1 0%, #d2d2d9 50%, #ffffff 100%);
    /*color:#e0e0e0;*/
    color:#000000;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
}

/* ── Header ────────────────────────────────────────────── */

header{
    flex-shrink:0;
    background:rgba(12,12,24,0.88);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding:10px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
    transition:max-height .3s ease, padding .3s ease;
}

header.collapsed #headerBody{
    display:none;
}

.header-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.header-title-bar{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:14px;
    color:#ffd54f;
    letter-spacing:0.5px;
}

.collapse-btn{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:6px;
    color:#aaa;
    cursor:pointer;
    padding:3px 9px;
    font-size:12px;
    transition:all .2s;
    display:inline-flex;
    align-items:center;
    gap:4px;
    user-select:none;
}

.collapse-btn:hover{
    background:rgba(255,255,255,0.12);
    color:#fff;
}

#headerBody{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.header-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
}

.header-row+.header-row{
    border-top:1px solid rgba(255,255,255,0.04);
    padding-top:8px;
}

/* ── File Labels ───────────────────────────────────────── */

.file-label{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    font-size:13px;
    color:#888;
    cursor:pointer;
    transition:all .2s;
}

.file-label:hover{
    background:rgba(255,255,255,0.08);
    color:#bbb;
    border-color:rgba(255,255,255,0.15);
}

.file-label input[type="file"]{display:none}

.file-name{
    color:#aaa;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
}

/* ── Audio ─────────────────────────────────────────────── */

audio{
    width:280px;
    height:34px;
    border-radius:8px;
    color-scheme:dark;
}

#status{
    margin-left:auto;
    font-size:12px;
    color:#555;
    white-space:nowrap;
}

/* ── Mode Selector ─────────────────────────────────────── */

.mode-group{
    display:inline-flex;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    overflow:hidden;
}

.mode-btn{
    padding:5px 14px;
    border:none;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    transition:all .25s;
    white-space:nowrap;
}

.mode-btn:hover{
    color:#ccc;
    background:rgba(255,255,255,0.05);
}

.mode-btn.active{
    background:linear-gradient(135deg,#ffd54f,#ffb300);
    color:#1a1a2e;
    font-weight:700;
}

/* ── Control Buttons ───────────────────────────────────── */

.ctrl-btn{
    padding:5px 14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    color:#ccc;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    transition:all .2s;
    white-space:nowrap;
}

.ctrl-btn:hover{
    background:rgba(255,255,255,0.12);
    color:#fff;
}

.ctrl-btn.toggle-active{
    background:linear-gradient(135deg,#ffd54f,#ffb300);
    color:#1a1a2e;
    font-weight:700;
    border-color:transparent;
}

.ctrl-btn.toggle-active:hover{
    background:linear-gradient(135deg,#ffe082,#ffca28);
    color:#1a1a2e;
}

.ctrl-label{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    color:#888;
}

select{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:6px;
    color:#ccc;
    padding:4px 8px;
    font-size:13px;
    cursor:pointer;
}

#search{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    color:#e0e0e0;
    padding:5px 10px;
    font-size:13px;
    outline:none;
    width:140px;
    transition:border-color .2s;
}

#search:focus{
    border-color:rgba(255,213,79,0.5);
}

.shortcuts-hint{
    font-size:16px;
    cursor:help;
    opacity:.4;
    transition:opacity .2s;
}

.shortcuts-hint:hover{opacity:.8}

/* ── Transcript Area ───────────────────────────────────── */

#transcript{
    flex:1;
    overflow-y:auto;
    padding:12px 20px 80px;
}

#transcript::-webkit-scrollbar{width:5px}
#transcript::-webkit-scrollbar-track{background:transparent}
#transcript::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
#transcript::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* ── Sentence Row ──────────────────────────────────────── */

.sentence-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 14px;
    margin:3px 0;
    border-radius:10px;
    border-left:3px solid transparent;
    transition:all .3s ease;
}

.sentence-row:hover{
    background:rgba(255,255,255,0.02);
}

.sentence-row.active{
    border-left-color:#ffd54f;
    background:rgba(255,213,79,0.03);
    box-shadow:inset 0 0 30px rgba(255,213,79,0.015);
}

/* ── Sentence Number ───────────────────────────────────── */

.sentence-num{
    min-width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    color:#444;
    border-radius:50%;
    cursor:pointer;
    transition:all .2s;
    flex-shrink:0;
    margin-top:6px;
}

.sentence-num:hover{
    background:rgba(255,213,79,0.12);
    color:#ffd54f;
    transform:scale(1.1);
}

.sentence-row.active .sentence-num{
    color:#ffd54f;
}

.sentence-content{
    flex:1;
    min-width:0;
}

/* ── Ground Truth Line ─────────────────────────────────── */

.sentence-gt{
    font-size:22px;
    line-height:2;
    transition:filter .35s ease;
}

.sentence-gt.masked{
    filter:blur(8px);
    user-select:none;
}

/* ── Word Spans ────────────────────────────────────────── */

.word{
    display:inline-block;
    padding:2px 6px;
    margin:1px 2px;
    border-radius:6px;
    cursor:pointer;
    transition:all .15s ease;
}

.sentence-gt.masked .word{
    /*background:rgba(255,255,255,0.06);*/
    border:1px solid rgba(255,255,255,0.08);
}

.sentence-gt.masked .word:hover{
    /*background:rgba(255,213,79,0.25);*/
    border-color:rgba(255,213,79,0.4);
    filter:none; /* subtle contrast on hover without revealing text due to parent blur */
}

.word:hover{
    /*background:rgba(255,255,255,0.12);*/
}

.current{
    background:linear-gradient(135deg,#ffd54f,#ffca28);
    color:#1a1a2e;
    font-weight:600;
    border-radius:5px;
    box-shadow:0 0 12px rgba(255,213,79,0.25);
}

.match{
    outline:2px solid #00bcd4;
    outline-offset:2px;
    border-radius:4px;
}

/* ── User Input (Dictation) ────────────────────────────── */

.sentence-input{
    margin-top:4px;
}

.sentence-input textarea{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    /*color:#e0e0e0;*/
    color:#3057d3;
    font-family:inherit;
    font-size:20px;
    line-height:1.8;
    padding:6px 12px;
    resize:none;
    outline:none;
    overflow:hidden;
    transition:border-color .2s, background .2s;
}

.sentence-input textarea:focus{
    border-color:rgba(255,213,79,0.4);
    background:rgba(255,255,255,0.05);
}

/* ── Reveal Button ─────────────────────────────────────── */

.reveal-btn{
    align-self:flex-start;
    margin-top:6px;
    padding:5px 8px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    color:#555;
    cursor:pointer;
    font-size:15px;
    transition:all .25s;
    flex-shrink:0;
}

.reveal-btn:hover{
    background:rgba(255,213,79,0.1);
    color:#ffd54f;
    border-color:rgba(255,213,79,0.3);
}

.reveal-btn.revealed{
    background:rgba(255,213,79,0.15);
    color:#ffd54f;
    border-color:rgba(255,213,79,0.4);
}

/* ── Drop Overlay ──────────────────────────────────────── */

#dropOverlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,30,0.88);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
}

#dropOverlay.visible{
    opacity:1;
    pointer-events:auto;
}

.drop-message{
    text-align:center;
    font-size:22px;
    font-weight:600;
    color:#ffd54f;
    border:3px dashed rgba(255,213,79,0.35);
    border-radius:20px;
    padding:50px 70px;
    pointer-events:none;
}

.drop-message small{
    display:block;
    margin-top:8px;
    font-size:13px;
    font-weight:400;
    color:#888;
}

/* ── A-B Loop Controls ─────────────────────────────────── */

.ab-group{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;
    padding:3px 8px;
    flex-wrap:wrap;
}

.ab-point{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:12px;
}

.ab-tag{
    font-weight:700;
    color:#ffd54f;
    font-size:12px;
    min-width:14px;
}

.time-box-group{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:6px;
    padding:2px 5px;
}

.time-box{
    width:24px;
    background:transparent;
    border:none;
    color:#e0e0e0;
    font-family:monospace;
    font-size:12px;
    text-align:center;
    outline:none;
    padding:1px 0;
    -moz-appearance:textfield;
}

.time-box::-webkit-inner-spin-button,
.time-box::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.time-box.ms{
    width:32px;
}

.time-sep{
    color:#666;
    font-size:11px;
    font-family:monospace;
    user-select:none;
}

.ab-btn{
    padding:3px 8px;
    font-size:11px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:6px;
    color:#ccc;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
}

.ab-btn:hover{
    background:rgba(255,213,79,0.15);
    color:#ffd54f;
    border-color:rgba(255,213,79,0.35);
}

.ab-active-badge{
    font-size:11px;
    padding:2px 6px;
    border-radius:4px;
    background:rgba(0,212,255,0.15);
    color:#00d4ff;
    border:1px solid rgba(0,212,255,0.3);
    display:none;
}

/* ── Mobile Action Bar & Floating Toggle ─────────────────── */

#mobileBarToggle{
    position:fixed;
    bottom:16px;
    right:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(20,20,38,0.92);
    border:1px solid rgba(255,213,79,0.4);
    color:#ffd54f;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    z-index:999;
    user-select:none;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:transform .2s, background .2s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

#mobileBarToggle:hover{
    transform:scale(1.08);
    background:rgba(30,30,55,0.98);
}

#mobileActionBar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(14,14,28,0.95);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,0.1);
    padding:8px 12px 10px;
    display:none;
    justify-content:center;
    align-items:center;
    gap:10px;
    z-index:950;
    box-shadow:0 -4px 20px rgba(0,0,0,0.5);
}

#mobileActionBar.visible{
    display:flex !important;
}

#mobileActionBar.visible ~ #mobileBarToggle{
    bottom:64px;
}

.mobile-action-btn{
    flex:1;
    max-width:140px;
    padding:8px 12px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    color:#e0e0e0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:all .15s;
    user-select:none;
    text-align:center;
    touch-action:manipulation;
}

.mobile-action-btn:active{
    background:rgba(255,213,79,0.25);
    color:#ffd54f;
    border-color:rgba(255,213,79,0.5);
    transform:scale(0.97);
}

.mobile-action-btn.accent{
    background:linear-gradient(135deg,rgba(255,213,79,0.2),rgba(255,179,0,0.2));
    border-color:rgba(255,213,79,0.4);
    color:#ffd54f;
}

</style>
</head>

<body>

<!-- ── Header ──────────────────────────────────────────── -->

<header id="mainHeader">

<div class="header-topbar">
    <div class="header-title-bar">
        <span>🎧 Dictation Player</span>
        <span id="abBadge" class="ab-active-badge">A-B Loop Active</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
        <span id="status">No transcript loaded</span>
        <button id="headerCollapseBtn" class="collapse-btn" title="Toggle panel collapse">▲ Hide Controls</button>
    </div>
</div>

<div id="headerBody">

<div class="header-row">
    <label class="file-label">
        🎵 Audio
        <input type="file" id="audioFile" accept="audio/mpeg, audio/mp3, audio/wav, audio/m4a, audio/x-m4a, .mp3, .wav, .m4a">
        <span class="file-name" id="audioFileName">Choose file</span>
    </label>
    <label class="file-label">
        📄 JSON
        <input type="file" id="jsonFile" accept=".json">
        <span class="file-name" id="jsonFileName">Choose file</span>
    </label>
    <label class="file-label">
        📝 Script
        <input type="file" id="transcriptFile" accept=".txt">
        <span class="file-name" id="scriptFileName">Choose file</span>
    </label>
    <audio id="audio" controls></audio>
</div>

<div class="header-row">
    <div class="mode-group">
        <button class="mode-btn active" data-mode="normal">▶ Normal</button>
        <button class="mode-btn" data-mode="dictation">🎧 Dictation</button>
    </div>
    <button id="repeatBtn" class="ctrl-btn" title="Toggle repeating the current sentence">🔁 Repeat: Off</button>
    <button id="playBtn" class="ctrl-btn">▶ Play</button>
    <label class="ctrl-label">Speed
        <select id="speed">
            <option>0.5</option>
            <option>0.75</option>
            <option selected>1</option>
            <option>1.25</option>
            <option>1.5</option>
            <option>2</option>
        </select>
    </label>
    <input id="search" placeholder="🔍 Search...">
    <button id="revealAllBtn" class="ctrl-btn" style="display:none">Reveal All</button>
    <button id="resetBtn" class="ctrl-btn" style="display:none">🗑 Reset</button>
    <span class="shortcuts-hint"
          title="Space : Play / Pause&#10;R / Ctrl+R : Toggle sentence repeat&#10;← / → : Prev / Next word&#10;Ctrl+↑ / ↓ : Prev / Next sentence&#10;Ctrl+← : Replay sentence from start&#10;Ctrl+→ : Advance to next sentence&#10;Esc : Exit text field&#10;Enter : Focus input / Reveal masked sentence">⌨️</span>
</div>

<!-- A-B Loop Row -->
<div class="header-row">
    <div class="ab-group">
        <span class="ab-tag">A:</span>
        <div class="time-box-group">
            <input type="number" id="ab_a_m" class="time-box" placeholder="mm" min="0" max="999">
            <span class="time-sep">:</span>
            <input type="number" id="ab_a_s" class="time-box" placeholder="ss" min="0" max="59">
            <span class="time-sep">.</span>
            <input type="number" id="ab_a_ms" class="time-box ms" placeholder="ms" min="0" max="999">
        </div>
        <button id="setABtn" class="ab-btn" title="Set A to start of current sentence (-0.1s)">Set A</button>
        <button id="clearABtn" class="ab-btn" title="Clear point A" style="opacity:0.7;">✕</button>

        <span class="ab-tag" style="margin-left:8px;">B:</span>
        <div class="time-box-group">
            <input type="number" id="ab_b_m" class="time-box" placeholder="mm" min="0" max="999">
            <span class="time-sep">:</span>
            <input type="number" id="ab_b_s" class="time-box" placeholder="ss" min="0" max="59">
            <span class="time-sep">.</span>
            <input type="number" id="ab_b_ms" class="time-box ms" placeholder="ms" min="0" max="999">
        </div>
        <button id="setBBtn" class="ab-btn" title="Set B to end of current sentence (+0.1s)">Set B</button>
        <button id="clearBBtn" class="ab-btn" title="Clear point B" style="opacity:0.7;">✕</button>
        <button id="clearAllABBtn" class="ab-btn" title="Clear both A and B" style="margin-left:4px;">Reset A-B</button>
    </div>
</div>

</div><!-- /headerBody -->

</header>

<!-- ── Transcript ──────────────────────────────────────── -->

<div id="transcript"></div>

<!-- ── Mobile Action Bar ───────────────────────────────── -->

<div id="mobileActionBar">
    <button id="mobPrevBtn" class="mobile-action-btn" title="Previous Sentence">⏮ Prev</button>
    <button id="mobNextContBtn" class="mobile-action-btn accent" title="Play continuously to next sentence">⏭ Next (Cont)</button>
    <button id="mobNextJumpBtn" class="mobile-action-btn" title="Jump to next sentence">⏭ Jump</button>
</div>

<!-- ── Floating Button to Toggle Mobile Bar ────────────── -->

<button id="mobileBarToggle" title="Toggle action buttons">🎮</button>

<!-- ── Drop Overlay ────────────────────────────────────── -->

<div id="dropOverlay">
    <div class="drop-message">
        Drop files here
        <small>Audio · JSON · Script (.txt)</small>
    </div>
</div>

<!-- ── Script ──────────────────────────────────────────── -->

<script>

/* ═══════════════════════════════════════════════════════
   Elements
   ═══════════════════════════════════════════════════════ */

const audio        = document.getElementById("audio");
const transcriptEl = document.getElementById("transcript");
const playBtn      = document.getElementById("playBtn");
const repeatBtn    = document.getElementById("repeatBtn");
const speedEl      = document.getElementById("speed");
const searchEl     = document.getElementById("search");
const statusEl     = document.getElementById("status");
const revealAllBtn = document.getElementById("revealAllBtn");
const resetBtn     = document.getElementById("resetBtn");

// Collapsible header
const mainHeader        = document.getElementById("mainHeader");
const headerCollapseBtn = document.getElementById("headerCollapseBtn");

// A-B loop elements
const ab_a_m     = document.getElementById("ab_a_m");
const ab_a_s     = document.getElementById("ab_a_s");
const ab_a_ms    = document.getElementById("ab_a_ms");
const ab_b_m     = document.getElementById("ab_b_m");
const ab_b_s     = document.getElementById("ab_b_s");
const ab_b_ms    = document.getElementById("ab_b_ms");
const setABtn    = document.getElementById("setABtn");
const setBBtn    = document.getElementById("setBBtn");
const clearABtn  = document.getElementById("clearABtn");
const clearBBtn  = document.getElementById("clearBBtn");
const clearAllABBtn = document.getElementById("clearAllABBtn");
const abBadge    = document.getElementById("abBadge");

// Mobile controls
const mobileActionBar  = document.getElementById("mobileActionBar");
const mobileBarToggle   = document.getElementById("mobileBarToggle");
const mobPrevBtn       = document.getElementById("mobPrevBtn");
const mobNextContBtn   = document.getElementById("mobNextContBtn");
const mobNextJumpBtn   = document.getElementById("mobNextJumpBtn");

/* ═══════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════ */

let words            = [];   // ASR word objects {text, start_time, end_time}
let spans            = [];   // DOM <span> for each matched word
let sentences        = [];   // sentence objects (see renderTranscript)
let currentWordIdx   = -1;   // highlighted word index
let activeSentenceIdx= -1;   // active sentence (for repeat loop target)
let mode             = "normal";  // "normal" | "dictation"
let repeatEnabled    = false;     // sentence repeat toggle
let pendingAdvance   = false;     // when true in repeat mode, plays past current sentence to next
let transcriptText   = "";

// A-B loop state (times in seconds, null if not set)
let loopPointA = null;
let loopPointB = null;

audio.loop = true;  // native loop when repeat is off

/* ═══════════════════════════════════════════════════════
   File Loading
   ═══════════════════════════════════════════════════════ */

document.getElementById("audioFile").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    audio.src = URL.createObjectURL(file);
    document.getElementById("audioFileName").textContent = file.name;
    resetABLoop();
};

document.getElementById("jsonFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    words = JSON.parse(await file.text());
    document.getElementById("jsonFileName").textContent = file.name;
    if (transcriptText) renderTranscript();
    statusEl.textContent = `${words.length} words`;
};

document.getElementById("transcriptFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    transcriptText = await file.text();
    document.getElementById("scriptFileName").textContent = file.name;
    if (words.length) renderTranscript();
};

/* ═══════════════════════════════════════════════════════
   Drag & Drop
   ═══════════════════════════════════════════════════════ */

const dropOverlay = document.getElementById("dropOverlay");
let dragCounter = 0;

document.addEventListener("dragenter", e => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add("visible");
});

document.addEventListener("dragleave", e => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove("visible");
    }
});

document.addEventListener("dragover", e => {
    e.preventDefault();
});

document.addEventListener("drop", async e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove("visible");

    for (const file of e.dataTransfer.files) {
        const name = file.name.toLowerCase();

        if (file.type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/.test(name)) {
            audio.src = URL.createObjectURL(file);
            document.getElementById("audioFileName").textContent = file.name;
            resetABLoop();

        } else if (name.endsWith(".json")) {
            words = JSON.parse(await file.text());
            document.getElementById("jsonFileName").textContent = file.name;
            if (transcriptText) renderTranscript();
            statusEl.textContent = `${words.length} words`;

        } else if (name.endsWith(".txt")) {
            transcriptText = await file.text();
            document.getElementById("scriptFileName").textContent = file.name;
            if (words.length) renderTranscript();
        }
    }
});

/* ═══════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════ */

function isIgnorable(ch) {
    return /[\s。、，「」『』（）()！？!?…・：；,，．]/u.test(ch);
}

/* ═══════════════════════════════════════════════════════
   Render Transcript  (sentence-level)
   ═══════════════════════════════════════════════════════ */

function renderTranscript() {

    transcriptEl.innerHTML = "";
    spans            = [];
    sentences        = [];
    currentWordIdx   = -1;
    activeSentenceIdx= -1;

    const lines = transcriptText.split(/\r?\n/);
    let globalWordIdx = 0;
    let sentNum       = 0;

    for (const line of lines) {

        if (line.trim() === "") continue;
        sentNum++;

        /* ── Row container ─────────────────────── */
        const row = document.createElement("div");
        row.className = "sentence-row";

        /* ── Sentence number (clickable) ───────── */
        const numEl = document.createElement("div");
        numEl.className = "sentence-num";
        numEl.textContent = sentNum;
        row.appendChild(numEl);

        /* ── Content wrapper ───────────────────── */
        const content = document.createElement("div");
        content.className = "sentence-content";

        /* ── Ground-truth line ─────────────────── */
        const gt = document.createElement("div");
        gt.className = "sentence-gt";

        const startWordIdx = globalWordIdx;
        let i = 0;

        while (i < line.length) {

            const ch = line[i];

            // Keep punctuation / whitespace as plain spans
            if (isIgnorable(ch)) {
                const s = document.createElement("span");
                s.textContent = ch;
                gt.appendChild(s);
                i++;
                continue;
            }

            if (globalWordIdx >= words.length) break;

            const token = words[globalWordIdx].text;

            // Greedy match against ASR token
            if (line.startsWith(token, i)) {

                const s    = document.createElement("span");
                s.className = "word";
                s.textContent = token;

                const wIdx = globalWordIdx;
                s.onclick  = () => jumpToWord(wIdx);

                gt.appendChild(s);
                spans.push(s);
                globalWordIdx++;
                i += token.length;

            } else {
                // Transcript differs from ASR — show char, don't consume token
                const s = document.createElement("span");
                s.textContent = ch;
                gt.appendChild(s);
                i++;
            }
        }

        const endWordIdx = globalWordIdx - 1;

        content.appendChild(gt);

        /* ── User-input textarea (dictation) ───── */
        const inputDiv = document.createElement("div");
        inputDiv.className = "sentence-input";
        inputDiv.style.display = "none";

        const ta = document.createElement("textarea");
        ta.rows       = 1;
        ta.spellcheck = false;
        ta.placeholder = "聞いた内容を入力...";
        ta.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = this.scrollHeight + "px";
        });

        inputDiv.appendChild(ta);
        content.appendChild(inputDiv);

        row.appendChild(content);

        /* ── Reveal button ─────────────────────── */
        const revBtn = document.createElement("button");
        revBtn.className = "reveal-btn";
        revBtn.style.display = "none";
        revBtn.textContent = "👁";
        revBtn.title = "Show answer";
        row.appendChild(revBtn);

        transcriptEl.appendChild(row);

        /* ── Sentence object ───────────────────── */
        const sIdx = sentences.length;

        const sent = {
            el          : row,
            gtEl        : gt,
            inputEl     : ta,
            inputDiv    : inputDiv,
            revealBtn   : revBtn,
            numEl       : numEl,
            startWordIdx: startWordIdx,
            endWordIdx  : endWordIdx,
            startTime   : startWordIdx <= endWordIdx
                              ? words[startWordIdx].start_time : null,
            endTime     : startWordIdx <= endWordIdx
                              ? words[endWordIdx].end_time : null,
            revealed    : false
        };

        sentences.push(sent);

        /* ── Per-sentence event handlers ────────── */
        numEl.onclick  = () => jumpToSentence(sIdx);
        revBtn.onclick = () => toggleReveal(sIdx);

        ta.addEventListener("focus", () => {
            setActiveSentence(sIdx);
        });
    }

    applyMode();

    statusEl.textContent =
        `${words.length} words · ${sentences.length} sentences`;

    console.log(
        `Matched ${globalWordIdx}/${words.length} ASR tokens, ` +
        `${sentences.length} sentences`
    );
}

/* ═══════════════════════════════════════════════════════
   Navigation
   ═══════════════════════════════════════════════════════ */

function jumpToWord(idx) {
    if (idx < 0 || idx >= words.length) return;
    pendingAdvance = false;
    audio.currentTime = words[idx].start_time;
    audio.play();
    const sIdx = findSentenceForWord(idx);
    if (sIdx >= 0) setActiveSentence(sIdx);
}

function findSentenceForLoopPointA(effA) {
    if (sentences.length === 0) return -1;
    for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        if (s.startTime !== null && s.endTime !== null) {
            // If effA is before or at sentence start, this is the first upcoming sentence
            if (s.startTime >= effA) return i;
            // If effA is inside the sentence, check if it's not just the very tail end
            if (effA >= s.startTime && effA < s.endTime - 0.15) return i;
        }
    }
    return Math.max(0, sentences.length - 1);
}

function wrapToLoopPointA() {
    if (sentences.length === 0) return;
    pendingAdvance = false;
    const effA = loopPointA !== null ? loopPointA : 0;
    let startIdx = findSentenceForLoopPointA(effA);
    if (startIdx < 0 || startIdx >= sentences.length) {
        startIdx = 0;
    }
    const targetSent = sentences[startIdx];
    audio.currentTime = effA;
    audio.play();
    setActiveSentence(startIdx);
    if (mode === "dictation" && targetSent.inputEl) targetSent.inputEl.focus();
    if (targetSent.el) targetSent.el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function jumpToSentence(idx) {
    // In repeat mode, jumping past the last sentence wraps around to Point A
    if (repeatEnabled && idx >= sentences.length && sentences.length > 0) {
        wrapToLoopPointA();
        return;
    }

    if (idx < 0 || idx >= sentences.length) return;

    // In repeat mode, do not allow jumping beyond A-B boundaries if set
    if (repeatEnabled) {
        const s = sentences[idx];
        const effA = loopPointA !== null ? loopPointA : 0;
        const effB = loopPointB !== null ? loopPointB : (audio.duration || Infinity);

        if (s.startTime !== null) {
            // If the target sentence ends before A, don't allow jumping out of bounds
            if (loopPointA !== null && s.endTime !== null && s.endTime < effA) {
                return;
            }
            // If the target sentence starts after B, wrap around to Point A (start a new loop)
            if (loopPointB !== null && s.startTime >= effB) {
                wrapToLoopPointA();
                return;
            }
        }
    }

    pendingAdvance = false;
    const s = sentences[idx];
    if (s.startTime !== null) {
        audio.currentTime = s.startTime;
        audio.play();
    }
    setActiveSentence(idx);
    if (mode === "dictation" && s.inputEl) s.inputEl.focus();
    if (s.el) s.el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function findSentenceForWord(wordIdx) {
    for (let i = 0; i < sentences.length; i++) {
        if (wordIdx >= sentences[i].startWordIdx &&
            wordIdx <= sentences[i].endWordIdx)
            return i;
    }
    return -1;
}

function findSentenceAtTime(t, findNearestNext = false) {
    for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        if (s.startTime !== null &&
            t >= s.startTime - 0.1 &&
            t <= s.endTime  + 0.1)
            return i;
    }
    if (findNearestNext) {
        for (let i = 0; i < sentences.length; i++) {
            const s = sentences[i];
            if (s.startTime !== null && s.startTime > t) {
                return i;
            }
        }
    }
    return -1;
}

function setActiveSentence(idx) {
    if (activeSentenceIdx === idx) return;
    if (activeSentenceIdx >= 0)
        sentences[activeSentenceIdx].el.classList.remove("active");
    activeSentenceIdx = idx;
    if (activeSentenceIdx >= 0)
        sentences[activeSentenceIdx].el.classList.add("active");
}

/* ═══════════════════════════════════════════════════════
   Reveal / Hide
   ═══════════════════════════════════════════════════════ */

function toggleReveal(idx) {
    const s = sentences[idx];
    s.revealed = !s.revealed;
    s.gtEl.classList.toggle("masked", !s.revealed);
    s.revealBtn.classList.toggle("revealed", s.revealed);
    s.revealBtn.title = s.revealed ? "Hide answer" : "Show answer";
    updateRevealAllBtn();
}

function revealAll() {
    const allRevealed = sentences.every(s => s.revealed);
    sentences.forEach(s => {
        s.revealed = !allRevealed;
        s.gtEl.classList.toggle("masked", allRevealed);
        s.revealBtn.classList.toggle("revealed", !allRevealed);
    });
    updateRevealAllBtn();
}

function updateRevealAllBtn() {
    const allRevealed =
        sentences.length > 0 && sentences.every(s => s.revealed);
    revealAllBtn.textContent = allRevealed ? "Hide All" : "Reveal All";
}

function resetInputs() {
    sentences.forEach(s => {
        s.inputEl.value = "";
        s.inputEl.style.height = "auto";
    });
}

function toggleRepeat(forceState) {
    if (typeof forceState === "boolean") {
        repeatEnabled = forceState;
    } else {
        repeatEnabled = !repeatEnabled;
    }

    // When enabling repeat, ensure an active sentence is targeted
    if (repeatEnabled && activeSentenceIdx < 0 && sentences.length > 0) {
        const sIdx = findSentenceAtTime(audio.currentTime);
        setActiveSentence(sIdx >= 0 ? sIdx : 0);
    }

    updateRepeatBtn();
}

function updateRepeatBtn() {
    audio.loop = !repeatEnabled; // Native loop when sentence repeat is off
    repeatBtn.classList.toggle("toggle-active", repeatEnabled);
    repeatBtn.textContent = repeatEnabled ? "🔁 Repeat: On" : "🔁 Repeat: Off";
}

function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll(".mode-btn").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.mode === mode)
    );
    if (mode === "dictation") {
        repeatEnabled = true;
    }
    applyMode();
}

function applyMode() {

    const isDictation = mode === "dictation";

    sentences.forEach(s => {

        // Show / hide dictation UI
        s.inputDiv.style.display  = isDictation ? "block"  : "none";
        s.revealBtn.style.display = isDictation ? "inline-block" : "none";

        // Apply / remove blur mask
        if (isDictation && !s.revealed) {
            s.gtEl.classList.add("masked");
        } else if (!isDictation) {
            s.gtEl.classList.remove("masked");
        }
    });

    revealAllBtn.style.display = isDictation ? "inline-block" : "none";
    resetBtn.style.display     = isDictation ? "inline-block" : "none";

    // Auto-detect active sentence when in dictation
    if (isDictation &&
        activeSentenceIdx < 0 &&
        sentences.length > 0) {
        const sIdx = findSentenceAtTime(audio.currentTime);
        setActiveSentence(sIdx >= 0 ? sIdx : 0);
    }

    updateRepeatBtn();
}

/* ═══════════════════════════════════════════════════════
   Playback — timeupdate
   ═══════════════════════════════════════════════════════ */

audio.addEventListener("timeupdate", () => {

    const t = audio.currentTime;

    /* ── 0. A-B Loop Enforcement (Always Respected) ── */

    const effA = loopPointA !== null ? loopPointA : 0;
    const effB = loopPointB !== null ? loopPointB : (audio.duration || Infinity);
    // If currentTime exceeds point B, loop back to point A
    if (t >= effB) {
        audio.currentTime = effA;
        pendingAdvance = false;
        if (repeatEnabled || loopPointA !== null || loopPointB !== null) {
            const startIdx = findSentenceForLoopPointA(effA);
            if (startIdx >= 0 && startIdx < sentences.length) {
                setActiveSentence(startIdx);
                const startSent = sentences[startIdx];
                if (mode === "dictation" && startSent.inputEl) startSent.inputEl.focus();
                if (startSent.el) startSent.el.scrollIntoView({ block: "center", behavior: "smooth" });
            }
        }
        return;
    }

    // If currentTime is somehow before point A (e.g. initial seek), adjust
    if (loopPointA !== null && t < effA - 0.5) {
        audio.currentTime = effA;
        pendingAdvance = false;
        const startIdx = findSentenceForLoopPointA(effA);
        if (startIdx >= 0 && startIdx < sentences.length) {
            setActiveSentence(startIdx);
            const startSent = sentences[startIdx];
            if (mode === "dictation" && startSent.inputEl) startSent.inputEl.focus();
            if (startSent.el) startSent.el.scrollIntoView({ block: "center", behavior: "smooth" });
        }
        return;
    }

    /* ── 1. Word highlight (binary search) ─────── */

    let lo = 0, hi = words.length - 1, wordIdx = -1;

    while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if      (t < words[mid].start_time) hi = mid - 1;
        else if (t > words[mid].end_time)   lo = mid + 1;
        else  { wordIdx = mid; break; }
    }

    if (wordIdx !== currentWordIdx) {

        if (currentWordIdx >= 0 && currentWordIdx < spans.length)
            spans[currentWordIdx].classList.remove("current");

        currentWordIdx = wordIdx;

        if (currentWordIdx >= 0 && currentWordIdx < spans.length) {
            spans[currentWordIdx].classList.add("current");
            spans[currentWordIdx].scrollIntoView({
                block    : "nearest",
                behavior : "smooth"
            });
        }
    }

    /* ── 2. Sentence tracking (when repeat is off) ─ */

    if (!repeatEnabled && currentWordIdx >= 0) {
        const sIdx = findSentenceForWord(currentWordIdx);
        if (sIdx >= 0) setActiveSentence(sIdx);
    }

    /* ── 3. Sentence repeat (when repeat toggle is ON) ─ */

    if (repeatEnabled) {

        if (activeSentenceIdx < 0) {
            // Auto-detect sentence
            const sIdx = findSentenceAtTime(t);
            if (sIdx >= 0) setActiveSentence(sIdx);

        } else if (pendingAdvance) {
            // User requested to advance: let audio play continuously past the current sentence
            const curSent = sentences[activeSentenceIdx];
            const nextIdx = activeSentenceIdx + 1;

            if (nextIdx < sentences.length) {
                const nextSent = sentences[nextIdx];
                // Check if next sentence starts beyond Point B
                if (loopPointB !== null && nextSent.startTime !== null && nextSent.startTime >= effB) {
                    // Next sentence is beyond B: wrap to Point A when point B reached or current sentence finished
                    if (t >= effB || (curSent.endTime !== null && t > curSent.endTime + 0.15)) {
                        wrapToLoopPointA();
                    }
                } else if (nextSent.startTime !== null && t >= nextSent.startTime - 0.05) {
                    pendingAdvance = false;
                    setActiveSentence(nextIdx);
                    if (mode === "dictation") sentences[nextIdx].inputEl.focus();
                } else if (curSent.endTime !== null && t > curSent.endTime + 1.5) {
                    // Safety: in case of long pause between sentences, snap to next sentence (if within B boundary)
                    if (loopPointB === null || nextSent.startTime === null || nextSent.startTime < effB) {
                        pendingAdvance = false;
                        setActiveSentence(nextIdx);
                        if (nextSent.startTime !== null && t < nextSent.startTime - 0.5) {
                            audio.currentTime = Math.max(effA, nextSent.startTime - 0.5);
                        }
                        if (mode === "dictation") sentences[nextIdx].inputEl.focus();
                    } else {
                        wrapToLoopPointA();
                    }
                }
            } else {
                // At the last sentence, wrap around to Point A
                pendingAdvance = false;
                if (curSent.endTime !== null && t > curSent.endTime + 0.15) {
                    wrapToLoopPointA();
                }
            }

        } else {
            const s = sentences[activeSentenceIdx];
            if (s.endTime !== null && t > s.endTime + 0.15) {
                audio.currentTime = Math.max(effA, s.startTime);
            }
        }
    }
});

// Handle audio end (or when end of loop reached)
audio.addEventListener("ended", () => {
    const effA = loopPointA !== null ? loopPointA : 0;
    if (loopPointA !== null || loopPointB !== null) {
        wrapToLoopPointA();
        return;
    }
    if (repeatEnabled && activeSentenceIdx >= 0) {
        const s = sentences[activeSentenceIdx];
        if (s.startTime !== null) {
            audio.currentTime = s.startTime;
            audio.play();
        }
    }
});

/* ═══════════════════════════════════════════════════════
   Controls
   ═══════════════════════════════════════════════════════ */

// Mode buttons
document.querySelectorAll(".mode-btn").forEach(btn =>

);

// Repeat toggle button
repeatBtn.onclick = () => toggleRepeat();

playBtn.onclick = () => {

};

audio.onplay  = () => { playBtn.textContent = "⏸ Pause"; };
audio.onpause = () => { playBtn.textContent = "▶ Play";  };

speedEl.onchange = () => {
    audio.playbackRate = parseFloat(speedEl.value);
};

// Search highlight
searchEl.oninput = () => {
    const q = searchEl.value.trim();
    spans.forEach(s => s.classList.remove("match"));
    if (!q) return;
    words.forEach((w, i) => {
        if (w.text.includes(q) && i < spans.length)
            spans[i].classList.add("match");
    });
};

// Reveal all / Reset
revealAllBtn.onclick = revealAll;
resetBtn.onclick     = resetInputs;

/* ═══════════════════════════════════════════════════════
   Collapsible Header
   ═══════════════════════════════════════════════════════ */

headerCollapseBtn.onclick = () => {
    const isCollapsed = mainHeader.classList.toggle("collapsed");
    headerCollapseBtn.textContent = isCollapsed ? "▼ Show Controls" : "▲ Hide Controls";
};

/* ═══════════════════════════════════════════════════════
   A-B Loop Logic
   ═══════════════════════════════════════════════════════ */

function secondsToTimeParts(sec) {
    if (sec === null || isNaN(sec) || sec < 0) return { m: "", s: "", ms: "" };
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const ms = Math.floor((sec - Math.floor(sec)) * 1000);
    return {
        m: String(m).padStart(2, "0"),
        s: String(s).padStart(2, "0"),
        ms: String(ms).padStart(3, "0")
    };
}

function timePartsToSeconds(mVal, sVal, msVal) {
    if (mVal === "" && sVal === "" && msVal === "") return null;
    const m = parseFloat(mVal) || 0;
    const s = parseFloat(sVal) || 0;
    const ms = parseFloat(msVal) || 0;
    return Math.max(0, m * 60 + s + ms / 1000);
}

function updateABInputs() {
    const partsA = secondsToTimeParts(loopPointA);
    ab_a_m.value = partsA.m;
    ab_a_s.value = partsA.s;
    ab_a_ms.value = partsA.ms;

    const partsB = secondsToTimeParts(loopPointB);
    ab_b_m.value = partsB.m;
    ab_b_s.value = partsB.s;
    ab_b_ms.value = partsB.ms;

    updateABBadge();
}

function updateABBadge() {
    const hasLoop = loopPointA !== null || loopPointB !== null;
    abBadge.style.display = hasLoop ? "inline-block" : "none";
}

function readABFromInputs() {
    loopPointA = timePartsToSeconds(ab_a_m.value, ab_a_s.value, ab_a_ms.value);
    loopPointB = timePartsToSeconds(ab_b_m.value, ab_b_s.value, ab_b_ms.value);

    // Validate if both set and B <= A
    if (loopPointA !== null && loopPointB !== null && loopPointB <= loopPointA) {
        loopPointB = loopPointA + 0.5;
        const partsB = secondsToTimeParts(loopPointB);
        ab_b_m.value = partsB.m;
        ab_b_s.value = partsB.s;
        ab_b_ms.value = partsB.ms;
    }

    updateABBadge();
}

// Attach input change listeners to A-B boxes
[ab_a_m, ab_a_s, ab_a_ms, ab_b_m, ab_b_s, ab_b_ms].forEach(input => { 
    input.addEventListener("input", readABFromInputs);
    input.addEventListener("change", readABFromInputs);
});

// Set A button: start of current sentence (-50% pause interval)
setABtn.onclick = () => {
    let targetSentence = null;
    let prevSentence = null;
    if (activeSentenceIdx >= 0 && activeSentenceIdx < sentences.length) {
        targetSentence = sentences[activeSentenceIdx];
        prevSentence = sentences[activeSentenceIdx - 1] ?? null;
    } else {
        const sIdx = findSentenceAtTime(audio.currentTime);
        if (sIdx >= 0) targetSentence = sentences[sIdx];
        prevSentence = sentences[sIdx - 1] ?? null;
    }

    if (targetSentence && targetSentence.startTime !== null) {
    	if (prevSentence !== null) {
	    	offset = Math.max((targetSentence.startTime - prevSentence.endTime) * 0.5, 0.1);
	    } else {
	    	offset = Math.max(targetSentence.startTime * 0.5, 0.1);
	    }
        loopPointA = Math.max(0, targetSentence.startTime - offset);
    } else {
        loopPointA = Math.max(0, audio.currentTime - 0.1);
    }

    // Auto-adjust B if needed
    if (loopPointB !== null && loopPointB <= loopPointA) {
        loopPointB = null;
    }

    updateABInputs();
};

// Set B button: end of current sentence (50% pause interval offset)
setBBtn.onclick = () => {
    let targetSentence = null;
    let nextSentence = null;
    let offset = 0;
    if (activeSentenceIdx >= 0 && activeSentenceIdx < sentences.length) {
        targetSentence = sentences[activeSentenceIdx];
        nextSentence = sentences[activeSentenceIdx + 1] ?? null;
    } else {
        const sIdx = findSentenceAtTime(audio.currentTime);
        if (sIdx >= 0) targetSentence = sentences[sIdx];
        nextSentence = sentences[sIdx + 1] ?? null;
    }

    if (targetSentence && targetSentence.endTime !== null) {
    	if (nextSentence !== null) {
	    	offset = Math.max((nextSentence.startTime - targetSentence.endTime) * 0.5, 0.1);
	    } else {
	    	offset = Math.max((audio.duration - targetSentence.endTime) * 0.5, 0.1);
	    }
        loopPointB = Math.min(targetSentence.endTime + offset, audio.duration);
    } else {
        loopPointB = Math.min(audio.currentTime + 0.1, audio.duration);
    }

    // Auto-adjust A if needed
    if (loopPointA !== null && loopPointA >= loopPointB) {
        loopPointA = Math.max(0, loopPointB - 0.5);
    }

    updateABInputs();
};

clearABtn.onclick = () => {
    loopPointA = null;
    updateABInputs();
};

clearBBtn.onclick = () => {
    loopPointB = null;
    updateABInputs();
};

function resetABLoop() {
    loopPointA = null;
    loopPointB = null;
    updateABInputs();
}

clearAllABBtn.onclick = resetABLoop;

/* ═══════════════════════════════════════════════════════
   Mobile Action Bar & Floating Button
   ═══════════════════════════════════════════════════════ */

function toggleMobileActionBar(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    mobileActionBar.classList.toggle("visible");
}

mobileBarToggle.addEventListener("click", toggleMobileActionBar);
mobileBarToggle.addEventListener("touchend", (e) => {
    e.preventDefault();
    toggleMobileActionBar();
});

// Mobile Prev sentence button
mobPrevBtn.onclick = () => {
    let target = (activeSentenceIdx >= 0 ? activeSentenceIdx : 0) - 1;
    target = Math.max(0, target);
    jumpToSentence(target);
};

// Mobile Next Jump button
mobNextJumpBtn.onclick = () => {
    let target = (activeSentenceIdx >= 0 ? activeSentenceIdx : 0) + 1;
    if (!repeatEnabled) {
        target = Math.min(sentences.length - 1, target);
    }
    jumpToSentence(target);
};

// Mobile Next Continuous button (Ctrl+Right equivalent)
mobNextContBtn.onclick = () => {
    if (!repeatEnabled) {
        toggleRepeat(true);
    }
    pendingAdvance = true;
    if (audio.paused) audio.play();
};

/* ═══════════════════════════════════════════════════════
   Keyboard Shortcuts
   ═══════════════════════════════════════════════════════ */

window.addEventListener("keydown", e => {

    const inInput =
        e.target.tagName === "INPUT" ||
        e.target.tagName === "TEXTAREA";

    /* ── Ctrl+Up / Down : navigate sentences ──── */
    /*    (works even when focused on a textarea)  */

    if (e.ctrlKey &&
        (e.key === "ArrowUp" || e.key === "ArrowDown")) {

        e.preventDefault();

        const dir    = e.key === "ArrowUp" ? -1 : 1;
        let   target = (activeSentenceIdx >= 0
                            ? activeSentenceIdx : 0) + dir;
        if (dir < 0 || !repeatEnabled) {
            target = Math.max(0, Math.min(sentences.length - 1, target));
        } else {
            target = Math.max(0, target);
        }
        jumpToSentence(target);
        return;
    }

    /* ── Ctrl+Left : jump to start of active sentence ─ */

    if (e.ctrlKey && e.key === "ArrowLeft" && !inInput) {
        e.preventDefault();
        pendingAdvance = false;
        if (activeSentenceIdx >= 0) {
            const s = sentences[activeSentenceIdx];
            if (s.startTime !== null) {
                audio.currentTime = s.startTime;
                audio.play();
            }
        }
        return;
    }

    /* ── Ctrl+Right : advance continuously to next sentence (when repeat is ON) ── */

    if (e.ctrlKey && e.key === "ArrowRight") {
        if (!repeatEnabled) return; // Do nothing if repeat is OFF
        e.preventDefault();
        // Play continuously past the end of the current sentence to the next sentence
        pendingAdvance = true;
        if (audio.paused) audio.play();
        return;
    }

    /* ── Esc : exit textarea focus ────────────────── */

    if (e.key === "Escape" && inInput) {
        e.preventDefault();
        e.target.blur();
        return;
    }

    /* ── Enter : focus input or reveal mask ───────── */

    if (e.key === "Enter" && !e.shiftKey) {
        if (inInput) {
            // Find which sentence this input belongs to
            let sIdx = sentences.findIndex(s => s.inputEl === e.target);
            if (sIdx === -1) sIdx = activeSentenceIdx;

            if (sIdx >= 0) {
                if (!sentences[sIdx].revealed) {
                    toggleReveal(sIdx);
                }
            }
            e.preventDefault();
            e.target.blur();
            return;
        } else if (mode === "dictation") {
            // Focus the input field of the currently active / playing sentence
            let targetIdx = activeSentenceIdx;
            if (targetIdx < 0 && sentences.length > 0) {
                targetIdx = findSentenceAtTime(audio.currentTime);
                if (targetIdx < 0) targetIdx = 0;
            }
            if (targetIdx >= 0 && targetIdx < sentences.length) {
                e.preventDefault();
                setActiveSentence(targetIdx);
                const s = sentences[targetIdx];
                s.inputEl.focus();
                s.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
                return;
            }
        }
    }

    // The remaining shortcuts are disabled when typing
    if (inInput) return;

    /* ── R / Ctrl+R : toggle sentence repeat ──── */

    if ((e.key === "r" || e.key === "R") && !e.altKey && !e.metaKey) {
        e.preventDefault();
        toggleRepeat();
        return;
    }

    /* ── Space : play / pause ─────────────────── */

    if (e.code === "Space") {
        e.preventDefault();
        if (audio.paused) audio.play(); else audio.pause();
    }

    /* ── ← : previous ASR word ────────────────── */

    if (e.key === "ArrowLeft") {
        e.preventDefault();
        const target = currentWordIdx > 0 ? currentWordIdx - 1 : 0;
        if (words.length) jumpToWord(target);
    }

    /* ── → : next ASR word ────────────────────── */

    if (e.key === "ArrowRight") {
        e.preventDefault();
        const target = currentWordIdx >= 0 ? currentWordIdx + 1 : 0;
        if (target < words.length) jumpToWord(target);
    }

});

</script>
